<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulse Messenger</title>
<style>
:root{--bg:#f6f4ff;--panel:#fff;--text:#1d1b2e;--muted:#6f6c85;--line:#e4e0f5;--accent:#6c4cf5;--their:#ece8ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14121f;--panel:#1d1a2d;--text:#f0eeff;--muted:#9c98b8;--line:#2e2a45;--their:#2a2640;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14121f;--panel:#1d1a2d;--text:#f0eeff;--muted:#9c98b8;--line:#2e2a45;--their:#2a2640;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit}
#auth{display:flex;height:100%;align-items:center;justify-content:center;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}
.card h1{margin:0;color:var(--accent)}
input,select{padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.btn{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:11px 16px;cursor:pointer}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:4px}
#err{color:#d33;font-size:14px;min-height:18px}
#app{display:none;height:100%;max-width:960px;margin:0 auto;background:var(--panel)}
#side{width:200px;border-right:1px solid var(--line);padding:16px 10px;flex:none;display:flex;flex-direction:column;gap:4px}
#side h2{margin:0 8px 10px;color:var(--accent);font-size:20px}
.room{text-align:left;border:0;background:none;color:var(--text);padding:10px 12px;border-radius:10px;cursor:pointer}
.room.on{background:var(--their);font-weight:600}
#me{margin-top:auto;font-size:13px;color:var(--muted);padding:8px}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#head{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:600}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.m{max-width:78%;padding:8px 12px;border-radius:16px;background:var(--their);align-self:flex-start;overflow-wrap:anywhere}
.m.me{background:var(--accent);color:#fff;align-self:flex-end}
.who{font-size:12px;opacity:.7}
#bar{border-top:1px solid var(--line);padding:10px;display:flex;gap:8px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
#txt{flex:1;min-width:0;border-radius:22px}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:12px 8px 4px}
#find{width:100%;padding:9px 12px;font-size:14px;border-radius:10px;margin-bottom:4px}
.hit{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:5px 8px;font-size:14px}
.hit span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hit button{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:4px 10px;font-size:13px;cursor:pointer}
.hit button.x,.hit button:disabled{background:var(--their);color:var(--muted)}
.sub{padding:4px 8px;font-size:13px;color:var(--muted)}
#chans{display:flex;flex-direction:column;gap:4px}
#head{display:flex;justify-content:space-between;align-items:center}
#gear{border:0;background:none;font-size:20px;cursor:pointer;padding:4px 6px;border-radius:8px}
#set{display:none;position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);align-items:center;justify-content:center}
#set .box{background:var(--panel);color:var(--text);width:92%;max-width:420px;max-height:85%;overflow-y:auto;border-radius:16px;padding:18px}
#set h3{margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
#sx{border:0;background:none;color:var(--text);font-size:18px;cursor:pointer}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.srow select{padding:6px 8px;border-radius:8px}
.srow input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.room{display:flex;align-items:center}
.room::before{content:"# "}
.av{flex:none;width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;margin-right:10px}
#back{display:none;border:0;background:none;color:var(--accent);font-size:30px;line-height:1;cursor:pointer;padding:0 12px 0 0}
#head>span{display:flex;align-items:center}
#gear2{display:none;border:0;background:none;font-size:22px;cursor:pointer;padding:0}
@media (max-width:640px){
 #app{flex-direction:column;height:100dvh}
 #side{width:100%;flex:1;min-height:0;overflow-y:auto;border-right:0;padding:14px 12px}
 #side h2{display:flex;justify-content:space-between;align-items:center;font-size:28px;margin:0 4px 12px}
 #gear2{display:block}#gear{display:none}#back{display:block}
 #main{display:none;flex:1;min-height:0}
 body.chat-open #side{display:none}
 body.chat-open #main{display:flex}
 #find{font-size:16px;padding:12px 14px;border-radius:22px;background:var(--their);border-color:transparent}
 #chans{flex-direction:column}
 .room{padding:10px 8px;font-size:17px;border-radius:12px}
 .room::before{content:"#";flex:none;width:36px;height:36px;border-radius:50%;background:var(--their);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;margin-right:10px}
 .hit{padding:8px;font-size:17px}
 .hit button{padding:6px 12px;font-size:14px}
 .sec{margin:16px 8px 6px}
 #msgs{padding:12px}
 .m{max-width:84%}
}
</style>
</head>
<body>
<div id="auth"><div class="card">
  <h1>Pulse ✦</h1>
  <input id="user" placeholder="Username (3–24 characters)" style="display:none" maxlength="24">
  <input id="email" type="email" placeholder="Email" autocomplete="email">
  <input id="pass" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
  <div id="err"></div>
  <button class="btn" id="go">Log in</button>
  <button class="link" id="swap">New here? Create an account</button>
</div></div>

<div id="app">
  <nav id="side"><h2>Pulse ✦ <button id="gear2" title="Settings">⚙️</button></h2>
    <input id="find" placeholder="Search people…" autocomplete="off"><div id="results"></div>
    <div class="sec">Channels</div>
    <div id="chans">
      <button class="room" data-c="general">general</button>
      <button class="room" data-c="random">random</button>
      <button class="room" data-c="ideas">ideas</button>
    </div>
    <div class="sec" id="reqSec" style="display:none">Friend requests</div><div id="reqs"></div>
    <div class="sec">Chats</div><div id="friends"><div class="sub">No chats yet</div></div>
    <div id="me"></div><button class="link" id="out">Log out</button>
  </nav>
  <section id="main">
    <div id="head"><span><button id="back" title="Back">‹</button><span id="ttl"></span></span><button id="gear" title="Settings">⚙️</button></div><div id="msgs"></div>
    <div id="bar">
      <button id="attach" title="Send image or file" style="border:0;border-radius:50%;width:42px;height:42px;flex:none;background:var(--their);color:var(--text);font-size:18px;cursor:pointer">📎</button><input type="file" id="file" hidden>
      <select id="mood"><option>😊</option><option>😂</option><option>😍</option><option>😢</option><option>😡</option><option>🔥</option></select>
      <input id="txt" placeholder="Write a message…" maxlength="1000" autocomplete="off">
      <button class="btn" id="send">Send</button>
    </div>
  </section>
</div>

<div id="set"><div class="box"><h3>Settings <button id="sx" title="Close">✕</button></h3>
  <div class="srow"><label for="sTheme">Theme</label><select id="sTheme"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select></div>
  <div class="srow"><label for="sSize">Text size</label><select id="sSize"><option value="s">Small</option><option value="m">Medium</option><option value="l">Large</option></select></div>
  <div class="srow"><label for="sEnter">Press Enter to send</label><input type="checkbox" id="sEnter"></div>
  <div class="srow"><label for="sSound">Sound for new messages</label><input type="checkbox" id="sSound"></div>
  <div class="srow"><label for="sMood">Default mood</label><select id="sMood"><option>😊</option><option>😂</option><option>😍</option><option>😢</option><option>😡</option><option>🔥</option></select></div>
  <div class="sub" id="sMe"></div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
if (!window.SUPABASE_URL || !window.SUPABASE_ANON_KEY || window.SUPABASE_ANON_KEY.includes("PASTE")) {
  document.body.textContent = "Setup needed: add your Supabase URL and anon key to config.js";
  throw new Error("config.js missing or incomplete");
}
const sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
let signup = false, me = null, channel = "general", sub = null, names = {}, seen = new Set();

/* ---- settings ---- */
let S = { theme: "auto", size: "m", enter: true, sound: true, mood: "😊" };
function applyS() {
  const r = document.documentElement;
  if (S.theme === "auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", S.theme);
  document.body.style.fontSize = { s: "14px", m: "16px", l: "19px" }[S.size] || "16px";
  $("sTheme").value = S.theme; $("sSize").value = S.size; $("sEnter").checked = !!S.enter;
  $("sSound").checked = !!S.sound; $("sMood").value = S.mood; $("mood").value = S.mood;
}
async function loadSettings() {
  const { data } = await sb.from("settings").select("*").eq("user_id", me).maybeSingle();
  if (data) S = { theme: data.theme, size: data.text_size, enter: data.enter_to_send, sound: data.sound, mood: data.mood };
  applyS();
}
async function saveS() {
  const { error } = await sb.from("settings").upsert({ user_id: me, theme: S.theme, text_size: S.size, enter_to_send: S.enter, sound: S.sound, mood: S.mood });
  if (error) alert("Couldn’t save settings: " + error.message);
}
function beep() {
  try { const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.value = .05; o.start(); o.stop(c.currentTime + .12); } catch (e) {}
}
$("gear").onclick = () => { $("sMe").textContent = "Signed in as " + (names[me] || "you"); $("set").style.display = "flex"; };
$("gear2").onclick = $("gear").onclick;
$("sx").onclick = () => { $("set").style.display = "none"; };
$("set").onclick = e => { if (e.target === $("set")) $("set").style.display = "none"; };
$("sTheme").onchange = e => { S.theme = e.target.value; applyS(); saveS(); };
$("sSize").onchange = e => { S.size = e.target.value; applyS(); saveS(); };
$("sEnter").onchange = e => { S.enter = e.target.checked; saveS(); };
$("sSound").onchange = e => { S.sound = e.target.checked; saveS(); };
$("sMood").onchange = e => { S.mood = e.target.value; applyS(); saveS(); };

/* ---- mobile: list screen -> chat screen (like Messenger) ---- */
const isMobile = () => window.matchMedia("(max-width:640px)").matches;
function showChat() {
  if (!isMobile() || document.body.classList.contains("chat-open")) return;
  document.body.classList.add("chat-open"); history.pushState({ chat: 1 }, "");
}
window.addEventListener("popstate", () => {
  if (!document.body.classList.contains("chat-open")) return;
  document.body.classList.remove("chat-open");
  if (dm) { dm = null; paintFriends(); }
});
$("back").onclick = () => {
  if (history.state && history.state.chat) history.back();
  else { document.body.classList.remove("chat-open"); if (dm) { dm = null; paintFriends(); } }
};

$("swap").onclick = () => {
  signup = !signup;
  $("user").style.display = signup ? "block" : "none";
  $("go").textContent = signup ? "Create account" : "Log in";
  $("swap").textContent = signup ? "Have an account? Log in" : "New here? Create an account";
  $("err").textContent = "";
};

$("go").onclick = async () => {
  $("err").textContent = "";
  const email = $("email").value.trim(), password = $("pass").value;
  let r;
  if (signup) {
    const username = $("user").value.trim();
    if (username.length < 3) { $("err").textContent = "Pick a username of at least 3 characters."; return; }
    r = await sb.auth.signUp({ email, password, options: { data: { username } } });
    if (!r.error && !r.data.session) { $("err").textContent = "Check your email to confirm, then log in."; return; }
  } else {
    r = await sb.auth.signInWithPassword({ email, password });
  }
  if (r.error) $("err").textContent = r.error.message.includes("profiles_username") ? "That username is taken." : r.error.message;
};

$("out").onclick = () => sb.auth.signOut();

sb.auth.onAuthStateChange((_e, session) => {
  if (session) { me = session.user.id; $("auth").style.display = "none"; $("app").style.display = "flex"; start(); }
  else { me = null; $("app").style.display = "none"; $("auth").style.display = "flex"; if (sub) sb.removeChannel(sub); }
});

async function loadNames() {
  const { data } = await sb.from("profiles").select("id,username");
  (data || []).forEach(p => names[p.id] = p.username);
  $("me").textContent = "Signed in as " + (names[me] || "you");
}

async function start() {
  await loadNames();
  loadFriends();
  loadSettings();
  subscribeDM();
  subscribeFriends();
  document.querySelectorAll(".room").forEach(b => b.onclick = () => openChannel(b.dataset.c, true));
  if (dm) openDM(dm); else openChannel(channel);
}

async function openChannel(c, user) {
  if (user) showChat();
  channel = c; dm = null; seen = new Set(); paintFriends();
  document.querySelectorAll(".room").forEach(b => b.classList.toggle("on", b.dataset.c === c));
  $("ttl").textContent = "# " + c; $("msgs").innerHTML = "";
  if (sub) await sb.removeChannel(sub);
  const { data } = await sb.from("messages").select("*").eq("channel", c).order("created_at", { ascending: false }).limit(100);
  (data || []).reverse().forEach(add);
  sub = sb.channel("room-" + c).on("postgres_changes",
    { event: "INSERT", schema: "public", table: "messages", filter: "channel=eq." + c },
    async p => { if (!names[p.new.user_id]) await loadNames(); if (p.new.user_id !== me && S.sound) beep(); add(p.new); }).subscribe();
}

function add(m) {
  if (seen.has(m.id)) return; seen.add(m.id);
  const box = $("msgs"), near = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
  const d = document.createElement("div"); d.className = "m" + (m.user_id === me ? " me" : "");
  const w = document.createElement("div"); w.className = "who"; w.textContent = m.user_id === me ? "You" : (names[m.user_id] || "Someone");
  const t = document.createElement("div"); t.textContent = (m.mood || "") + " " + m.text; if (!m.text) t.style.display = "none";
  d.append(w, t);
  if (m.file_path) d.appendChild(fileEl(m, () => { if (near || m.user_id === me) box.scrollTop = box.scrollHeight; }));
  box.appendChild(d);
  if (near || m.user_id === me) box.scrollTop = box.scrollHeight;
}

async function send() {
  const text = $("txt").value.trim(); if (!text) return;
  $("txt").value = "";
  const target = dm, mood = $("mood").value;
  const { data, error } = target
    ? await sb.from("direct_messages").insert({ recipient_id: target, text, mood }).select().single()
    : await sb.from("messages").insert({ channel, text, mood }).select().single();
  if (error) { $("txt").value = text; alert("Couldn’t send: " + error.message); return; }
  if (dm === target) add(target ? { ...data, user_id: data.sender_id } : data);
}
/* ---- friends, requests & search ---- */
let fs = [], dm = null, unread = new Set(), dmSub = null, frSub = null, st = null;
const other = r => r.requester_id === me ? r.addressee_id : r.requester_id;
const relOf = id => fs.find(r => other(r) === id);

function mkBtn(label, fn, cls) { const b = document.createElement("button"); if (cls) b.className = cls; b.textContent = label; b.onclick = fn; return b; }
function mkRow(text, btns, onText) {
  const r = document.createElement("div"); r.className = "hit";
  const av = document.createElement("span"); av.className = "av";
  av.textContent = (Array.from(text.replace(/^●\s*/u, ""))[0] || "?").toUpperCase();
  const n = document.createElement("span"); n.style.flex = "1"; n.textContent = text;
  if (onText) { n.style.cursor = "pointer"; n.onclick = onText; }
  r.append(av, n, ...btns); return r;
}
function note(box, text) { const s = document.createElement("div"); s.className = "sub"; s.textContent = text; box.appendChild(s); }
async function act(promise, msg) { const { error } = await promise; if (error) alert(msg + ": " + error.message); else loadFriends(); }
const accept = r => act(sb.from("friendships").update({ status: "accepted" }).eq("id", r.id), "Couldn’t accept");
const drop = r => act(sb.from("friendships").delete().eq("id", r.id), "Couldn’t remove");

async function loadFriends() {
  const { data } = await sb.from("friendships").select("*");
  fs = data || [];
  if (fs.some(r => !names[other(r)])) await loadNames();
  paintFriends(); runFind();
}

function paintFriends() {
  const incoming = fs.filter(r => r.status === "pending" && r.addressee_id === me);
  const rq = $("reqs"); rq.innerHTML = "";
  $("reqSec").style.display = incoming.length ? "block" : "none";
  incoming.forEach(r => rq.appendChild(mkRow(names[r.requester_id] || "Someone",
    [mkBtn("Accept", () => accept(r)), mkBtn("Decline", () => drop(r), "x")])));
  const box = $("friends"); box.innerHTML = "";
  const accepted = fs.filter(r => r.status === "accepted");
  if (!accepted.length) { note(box, "No chats yet. Search for someone and send a friend request."); return; }
  accepted.forEach(r => {
    const id = other(r);
    const row = mkRow((unread.has(id) ? "● " : "") + (names[id] || "Someone"),
      [mkBtn("Remove", () => drop(r), "x")], () => openDM(id, true));
    if (dm === id || unread.has(id)) row.children[1].style.fontWeight = "700";
    box.appendChild(row);
  });
}

async function openDM(uid, user) {
  if (user) showChat();
  dm = uid; unread.delete(uid); seen = new Set();
  document.querySelectorAll(".room").forEach(b => b.classList.remove("on"));
  $("ttl").textContent = "💬 " + (names[uid] || "Chat"); $("msgs").innerHTML = "";
  if (sub) { await sb.removeChannel(sub); sub = null; }
  paintFriends();
  const { data, error } = await sb.from("direct_messages").select("*")
    .or("and(sender_id.eq." + me + ",recipient_id.eq." + uid + "),and(sender_id.eq." + uid + ",recipient_id.eq." + me + ")")
    .order("created_at", { ascending: false }).limit(100);
  if (dm !== uid) return;
  if (error) { alert("Couldn’t load chat: " + error.message); return; }
  (data || []).reverse().forEach(m => add({ ...m, user_id: m.sender_id }));
}

async function subscribeDM() {
  if (dmSub) await sb.removeChannel(dmSub);
  dmSub = sb.channel("dm-in").on("postgres_changes",
    { event: "INSERT", schema: "public", table: "direct_messages", filter: "recipient_id=eq." + me },
    async p => {
      const m = p.new;
      if (!names[m.sender_id]) await loadNames();
      if (dm === m.sender_id) add({ ...m, user_id: m.sender_id }); else unread.add(m.sender_id);
      if (S.sound) beep();
      paintFriends();
    }).subscribe();
}

async function subscribeFriends() {
  if (frSub) await sb.removeChannel(frSub);
  let ch = sb.channel("friends-in");
  ["requester_id", "addressee_id"].forEach(col => ["INSERT", "UPDATE"].forEach(ev => {
    ch = ch.on("postgres_changes", { event: ev, schema: "public", table: "friendships", filter: col + "=eq." + me }, () => loadFriends());
  }));
  frSub = ch.subscribe();
}

const cleanQ = () => $("find").value.trim().replace(/[%_,()\\]/g, "");
$("find").oninput = () => { clearTimeout(st); st = setTimeout(runFind, 250); };
async function runFind() {
  const q = cleanQ(), box = $("results");
  if (q.length < 2) { box.innerHTML = ""; return; }
  const { data, error } = await sb.from("profiles").select("id,username").ilike("username", "%" + q + "%").neq("id", me).limit(8);
  if (cleanQ() !== q) return;
  box.innerHTML = "";
  if (error || !data.length) { note(box, error ? "Search failed" : "No one found"); return; }
  data.forEach(u => {
    names[u.id] = u.username;
    const rel = relOf(u.id); let b;
    if (!rel) b = mkBtn("Add", async () => { b.disabled = true;
      const { error } = await sb.from("friendships").insert({ addressee_id: u.id });
      if (error) { b.disabled = false; alert("Couldn’t send request: " + error.message); } else loadFriends(); });
    else if (rel.status === "accepted") { b = mkBtn("Friends"); b.disabled = true; }
    else if (rel.addressee_id === me) b = mkBtn("Accept", () => accept(rel));
    else { b = mkBtn("Requested"); b.disabled = true; }
    box.appendChild(mkRow(u.username, [b]));
  });
}

/* ---- images & files ---- */
const urlCache = {};
const fmtSize = n => n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
async function signed(path, name) {
  const k = path + "|" + (name || "");
  if (urlCache[k]) return urlCache[k];
  const { data, error } = await sb.storage.from("attachments").createSignedUrl(path, 3600, name ? { download: name } : undefined);
  return error ? null : (urlCache[k] = data.signedUrl);
}
function fileEl(m, onLoad) {
  const wrap = document.createElement("div"); wrap.style.marginTop = "4px";
  if (/^image\/(png|jpe?g|gif|webp)$/.test(m.file_type || "")) {
    const im = document.createElement("img"); im.alt = m.file_name || "image";
    im.style.cssText = "display:block;max-width:100%;max-height:300px;border-radius:12px;min-height:60px;cursor:pointer";
    im.onload = onLoad;
    signed(m.file_path).then(u => { if (u) { im.src = u; im.onclick = () => window.open(u, "_blank", "noopener"); } else im.alt = "Image unavailable"; });
    wrap.appendChild(im);
  } else if (/^(video\/(mp4|webm|quicktime|ogg)|audio\/(mpeg|mp4|ogg|wav|webm|x-m4a|aac))$/.test(m.file_type || "")) {
    const isAudio = m.file_type.startsWith("audio");
    const v = document.createElement(isAudio ? "audio" : "video");
    v.controls = true; v.preload = "metadata"; v.playsInline = true;
    v.style.cssText = "display:block;max-width:100%;border-radius:12px;" + (isAudio ? "" : "max-height:340px;background:#000");
    v.onloadedmetadata = onLoad;
    signed(m.file_path).then(u => { if (u) v.src = u; });
    wrap.append(v, fileBtn(m, "⬇ "));
  } else {
    wrap.appendChild(fileBtn(m, "📄 "));
  }
  return wrap;
}
function fileBtn(m, icon) {
  {
    const b = document.createElement("button");
    b.style.cssText = "border:0;border-radius:10px;padding:8px 10px;cursor:pointer;background:rgba(127,127,127,.25);color:inherit;font:inherit;text-align:left;max-width:100%;overflow-wrap:anywhere";
    b.textContent = icon + (m.file_name || "file") + (m.file_size ? " · " + fmtSize(m.file_size) : "");
    b.onclick = async () => {
      const u = await signed(m.file_path, m.file_name || "file");
      if (!u) return alert("File unavailable");
      const a = document.createElement("a"); a.href = u; a.rel = "noopener"; a.click();
    };
    b.style.marginTop = "4px";
    return b;
  }
}
$("attach").onclick = () => $("file").click();
$("file").onchange = async e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  if (f.size > 50 * 1024 * 1024) { alert("Files must be under 50 MB (" + fmtSize(f.size) + " is too big)."); return; }
  const target = dm, btn = $("attach"); btn.disabled = true; btn.textContent = "⏳";
  try {
    const safe = f.name.replace(/[^\w.\-]+/g, "_").slice(-80);
    const path = me + "/" + crypto.randomUUID() + "-" + safe;
    const up = await sb.storage.from("attachments").upload(path, f, { contentType: f.type || "application/octet-stream" });
    if (up.error) throw up.error;
    const row = { text: "", mood: $("mood").value, file_path: path, file_name: f.name.slice(0, 120), file_type: f.type || "", file_size: f.size };
    const { data, error } = target
      ? await sb.from("direct_messages").insert({ ...row, recipient_id: target }).select().single()
      : await sb.from("messages").insert({ ...row, channel }).select().single();
    if (error) throw error;
    if (dm === target) add(target ? { ...data, user_id: data.sender_id } : data);
  } catch (err) { alert("Couldn’t send file: " + (err.message || err)); }
  btn.disabled = false; btn.textContent = "📎";
};

$("send").onclick = send;
$("txt").addEventListener("keydown", e => { if (e.key === "Enter" && S.enter) send(); });
</script>
